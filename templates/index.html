<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VTracer — Raster to SVG</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2a2d3a;
    --text: #e1e4eb;
    --muted: #8b8fa3;
    --accent: #7c5cfc;
    --accent-hover: #6a4be0;
    --green: #2ecc71;
    --red: #e74c3c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
  }
  .sidebar {
    width: 320px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    overflow-y: auto;
  }
  .sidebar h1 {
    font-size: 20px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sidebar h1 span { color: var(--accent); }
  .sidebar label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
    margin-bottom: 4px;
    display: block;
  }
  .sidebar select, .sidebar input[type="range"] {
    width: 100%;
    padding: 8px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
  }
  .sidebar input[type="range"] { padding: 0; accent-color: var(--accent); }
  .range-val { font-size: 12px; color: var(--muted); float: right; }
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
  }
  .dropzone {
    width: 100%;
    max-width: 600px;
    border: 2px dashed var(--border);
    border-radius: 16px;
    padding: 60px 40px;
    text-align: center;
    cursor: pointer;
    transition: all .2s;
    margin-bottom: 24px;
  }
  .dropzone:hover, .dropzone.drag-over {
    border-color: var(--accent);
    background: rgba(124,92,252,0.05);
  }
  .dropzone .icon { font-size: 48px; margin-bottom: 12px; }
  .dropzone h3 { font-size: 18px; margin-bottom: 4px; }
  .dropzone p { font-size: 14px; color: var(--muted); }
  #file-input { display: none; }
  .btn {
    padding: 12px 28px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
  }
  .btn-secondary:hover { background: var(--border); }
  .result {
    width: 100%;
    max-width: 900px;
    margin-top: 24px;
  }
  .result-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .result-preview {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    max-height: 500px;
    overflow: auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .result-preview svg { max-width: 100%; max-height: 460px; }
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--green);
    color: #000;
    padding: 10px 20px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 13px;
    opacity: 0;
    transition: opacity .3s;
    z-index: 999;
  }
  .toast.show { opacity: 1; }
  .error { color: var(--red); font-size: 13px; }
  .loading { display: none; text-align: center; padding: 20px; }
  .loading.active { display: block; }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .6s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .stats { font-size: 12px; color: var(--muted); }
  .actions { display: flex; gap: 8px; }
  @media (max-width: 768px) {
    body { flex-direction: column; }
    .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>

<div class="sidebar">
  <h1><span>◈</span> VTracer</h1>
  <p style="font-size:13px;color:var(--muted)">Converta imagens raster (PNG, JPG, WebP) em SVG vetorial com precisão.</p>
  
  <div>
    <label>Modo de Cor</label>
    <select id="colormode">
      <option value="color">Colorido</option>
      <option value="bw">Preto e Branco</option>
    </select>
  </div>
  
  <div>
    <label>Estilo de Curva</label>
    <select id="mode">
      <option value="spline">Spline (suave)</option>
      <option value="polygon">Polígono</option>
      <option value="pixel">Pixel</option>
    </select>
  </div>
  
  <div>
    <label>Precisão de Cor <span class="range-val" id="cp-val">6</span></label>
    <input type="range" id="color_precision" min="1" max="10" value="6">
  </div>
  
  <div>
    <label>Gradient Step <span class="range-val" id="ld-val">16</span></label>
    <input type="range" id="gradient_step" min="4" max="64" value="16">
  </div>
  
  <div>
    <label>Threshold de Canto <span class="range-val" id="ct-val">60</span></label>
    <input type="range" id="corner_threshold" min="10" max="120" value="60">
  </div>
  
  <div>
    <label>Precisão de Path <span class="range-val" id="pp-val">4</span></label>
    <input type="range" id="path_precision" min="1" max="8" value="4">
  </div>
  
  <div>
    <label>Filtro Speckle <span class="range-val" id="fs-val">4</span></label>
    <input type="range" id="filter_speckle" min="0" max="20" value="4">
  </div>
</div>

<div class="main">
  <div class="dropzone" id="dropzone">
    <div class="icon">📤</div>
    <h3>Arraste uma imagem aqui</h3>
    <p>ou clique para selecionar — PNG, JPG, WebP, BMP</p>
  </div>
  <input type="file" id="file-input" accept="image/*">
  
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p style="color:var(--muted);font-size:13px">Convertendo...</p>
  </div>
  
  <div class="result" id="result" style="display:none">
    <div class="result-header">
      <span class="stats" id="stats"></span>
      <div class="actions">
        <button class="btn btn-secondary" id="copy-btn">📋 Copiar SVG</button>
        <button class="btn" id="download-btn">⬇ Download</button>
      </div>
    </div>
    <div class="result-preview" id="preview"></div>
  </div>
  
  <div id="error" class="error" style="margin-top:12px;display:none"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('file-input');
const loading = document.getElementById('loading');
const result = document.getElementById('result');
const preview = document.getElementById('preview');
const stats = document.getElementById('stats');
const error = document.getElementById('error');
const toast = document.getElementById('toast');

let currentSvg = null;

dropzone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', handleFile);

dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag-over'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('drag-over');
  if (e.dataTransfer.files.length) processFile(e.dataTransfer.files[0]);
});

function handleFile(e) {
  if (e.target.files.length) processFile(e.target.files[0]);
}

// Range labels
['color_precision','gradient_step','corner_threshold','path_precision','filter_speckle'].forEach(id => {
  document.getElementById(id).addEventListener('input', function() {
    document.getElementById(id.replace('_','-').substring(0,2)+'-val').textContent = this.value;
  });
});

async function processFile(file) {
  error.style.display = 'none';
  result.style.display = 'none';
  loading.classList.add('active');
  
  const formData = new FormData();
  formData.append('image', file);
  formData.append('colormode', document.getElementById('colormode').value);
  formData.append('mode', document.getElementById('mode').value);
  formData.append('filter_speckle', document.getElementById('filter_speckle').value);
  formData.append('color_precision', document.getElementById('color_precision').value);
  formData.append('gradient_step', document.getElementById('gradient_step').value);
  formData.append('corner_threshold', document.getElementById('corner_threshold').value);
  formData.append('path_precision', document.getElementById('path_precision').value);
  
  try {
    const resp = await fetch('/convert', { method: 'POST', body: formData });
    const data = await resp.json();
    loading.classList.remove('active');
    
    if (data.error) {
      error.textContent = data.error;
      error.style.display = 'block';
      return;
    }
    
    currentSvg = data.svg;
    preview.innerHTML = data.svg;
    stats.textContent = `SVG gerado · ${(data.size_bytes/1024).toFixed(1)} KB`;
    result.style.display = 'block';
    dropzone.querySelector('h3').textContent = file.name;
    dropzone.querySelector('p').textContent = 'Arraste outra imagem para converter';
    
  } catch (err) {
    loading.classList.remove('active');
    error.textContent = 'Erro de conexão: ' + err.message;
    error.style.display = 'block';
  }
}

document.getElementById('download-btn').addEventListener('click', () => {
  if (!currentSvg) return;
  const blob = new Blob([currentSvg], {type: 'image/svg+xml'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'vector.svg';
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('copy-btn').addEventListener('click', async () => {
  if (!currentSvg) return;
  await navigator.clipboard.writeText(currentSvg);
  toast.textContent = 'SVG copiado!';
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
});
</script>
</body>
</html>
